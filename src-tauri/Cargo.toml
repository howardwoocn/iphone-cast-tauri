[package]
name = "iphone-cast-tauri"
version = "1.0.0"
description = "Local iPhone AirPlay mirroring and Bluetooth pointer control"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-future = "0.2"
windows = { version = "0.61", features = [
  "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Bluetooth_Advertisement",
  "Foundation", "Foundation_Collections", "Storage_Streams",
  "Devices_Enumeration", "Media_Audio",
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_WinRT", "Win32_Security",
  "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"
] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
